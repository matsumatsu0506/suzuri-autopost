name: SUZURI 閾ｪ蜍墓兜遞ｿ

on:
  schedule:
    # cron 縺ｯ UTC 縺ｧ譖ｸ縺阪∪縺吶よ律譛ｬ譎る俣 = UTC + 9譎る俣縲・    - cron: '30 21 * * *' # 譌･譛ｬ譎る俣 6:30・亥燕譌･縺ｮ 21:30 UTC・・    - cron: '30 9 * * *' # 譌･譛ｬ譎る俣 18:30
  workflow_dispatch:
    inputs:
      slot:
        description: '縺ｩ縺｡繧峨・譫縺ｨ縺励※螳溯｡後☆繧九°'
        type: choice
        options: [manual, morning, evening]
        default: manual
      dry_run:
        description: '謚慕ｨｿ縺帙★縺ｫ逕滓・邨先棡縺縺醍｢ｺ隱阪☆繧・
        type: boolean
        default: true

# 蜷梧凾縺ｫ襍ｰ縺｣縺ｦ state 縺悟｣翫ｌ縺ｪ縺・ｈ縺・↓縺吶ｋ
concurrency:
  group: suzuri-autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 螳溯｡後☆繧区棧繧呈ｱｺ繧√ｋ
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
            echo "dry=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 21 * * *" ]; then
            echo "slot=morning" >> "$GITHUB_OUTPUT"
            echo "dry=false" >> "$GITHUB_OUTPUT"
          else
            echo "slot=evening" >> "$GITHUB_OUTPUT"
            echo "dry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 謚慕ｨｿ縺吶ｋ
        env:
          SUZURI_API_TOKEN: ${{ secrets.SUZURI_API_TOKEN }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          if [ "${{ steps.slot.outputs.dry }}" = "true" ]; then
            npm run post -- --slot=${{ steps.slot.outputs.slot }} --dry-run
          else
            npm run post -- --slot=${{ steps.slot.outputs.slot }}
          fi

      - name: 謚慕ｨｿ縺ｮ險倬鹸繧偵さ繝溘ャ繝医☆繧・        if: always()
        run: |
          if [ -z "$(git status --porcelain state/posted.json)" ]; then
            echo "state 縺ｫ螟画峩縺ｯ縺ゅｊ縺ｾ縺帙ｓ縲・
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          git commit -m "chore: 謚慕ｨｿ險倬鹸繧呈峩譁ｰ [skip ci]"
          git push || {
            echo "push 縺檎ｫｶ蜷医＠縺溘・縺ｧ rebase 縺励※蜀崎ｩｦ陦後＠縺ｾ縺吶・
            git pull --rebase --autostash
            git push
          }

